plugins {
    id 'com.android.application'
}

android {
    namespace 'com.barmaan.barmaanos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.barmaan.barmaanos'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
